name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      # Tanzil text is not in the repository. It can be restored from a cache
      # that was filled once by a maintainer (see README, "Full-corpus tests").
      # When absent, the full-corpus tests are skipped.
      - name: Restore Tanzil data (optional)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tanzil-data-v1
          fail-on-cache-miss: false

      - name: Lint
        run: |
          ruff check src tests scripts evaluation
          ruff format --check src tests scripts evaluation

      - name: Types
        run: mypy --strict src

      - name: Tests
        run: python -m pytest -q
