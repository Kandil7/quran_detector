[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quran-detector"
version = "0.6.0"
description = "Detect, ground and verify Quran quotes in Arabic text"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
quran-detector = "quran_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
quran_detector = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.10", "ruff>=0.5", "jsonschema>=4.18"]

[tool.mypy]
files = ["src"]
strict = true

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests", "evaluation", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
